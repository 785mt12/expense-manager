<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>支出管理</title>
  <style>
    :root{--primary:#2563eb;--primary2:#1d4ed8;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e5eaf1;--danger:#dc2626;--shadow:0 8px 24px rgba(30,64,175,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer} .app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:92px}
    header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);padding:18px 18px 10px}
    header h1{font-size:22px;margin:0} header p{color:var(--muted);margin:4px 0 0;font-size:13px}
    main{padding:8px 16px 24px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
    .hero{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;border:0}.hero .muted{color:#dbeafe}.amount{font-size:34px;font-weight:800;letter-spacing:-1px;margin:3px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-size:13px}
    .budget-title{font-weight:700}.progress{height:11px;background:#e8eef9;border-radius:999px;overflow:hidden;margin:12px 0 8px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:inherit}.progress.over>span{background:linear-gradient(90deg,#f59e0b,#dc2626)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:14px;border-radius:14px;background:#f7f9fc}.stat b{display:block;font-size:19px;margin-top:4px}
    .fab{position:fixed;right:max(20px,calc((100vw - 680px)/2 + 20px));bottom:84px;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:14px 19px;font-weight:800;box-shadow:0 10px 28px rgba(37,99,235,.35);z-index:30}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:25}
    nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 1px} nav button span{display:block;font-size:21px;line-height:24px}nav button.active{color:var(--primary);font-weight:800}
    .section-title{font-size:16px;margin:0 0 13px}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eef4ff;font-size:20px}.item-title{font-weight:700}.item-amount{font-weight:800;text-align:right}.tag{display:inline-block;background:#eef2f7;color:#526070;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:4px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.field{width:100%;border:1px solid #d9e0ea;border-radius:12px;background:#fff;padding:12px 13px;color:var(--text)}textarea.field{resize:vertical;min-height:80px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:13px 16px;font-weight:800}.primary{background:var(--primary);color:#fff}.secondary{background:#eaf1ff;color:var(--primary)}.danger{background:#fee2e2;color:var(--danger)}.wide{width:100%}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}
    .tabs{display:flex;background:#e9eef6;border-radius:12px;padding:4px;margin:8px 0 14px}.tabs button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted)}.tabs button.active{background:#fff;color:var(--primary);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.07)}
    .period-controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.period-controls button{border:0;background:#eaf1ff;color:var(--primary);border-radius:10px;padding:9px 12px}.period-label{font-weight:800;text-align:center}
    .chart-wrap{display:grid;place-items:center;margin:18px 0}.pie{width:230px;height:230px;border-radius:50%;position:relative;background:#e5e7eb}.pie:after{content:"";position:absolute;inset:52px;background:#fff;border-radius:50%}.pie-center{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;pointer-events:none}.pie-center b{font-size:21px}.legend{display:grid;gap:10px}.legend-row{display:grid;grid-template-columns:13px 1fr auto;gap:9px;align-items:center}.dot{width:11px;height:11px;border-radius:50%}.empty{text-align:center;color:var(--muted);padding:22px 8px}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.swatch{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);max-height:88vh;box-shadow:0 24px 80px rgba(15,23,42,.3)}dialog::backdrop{background:rgba(15,23,42,.5)}.modal-body{padding:20px;overflow:auto;max-height:88vh}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef2f7;border-radius:999px;width:34px;height:34px}.week-list{display:grid;gap:8px}.week-row{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#172033;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
    .calendar-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:14px}.calendar-head span:first-child{color:#dc2626}.calendar-head span:last-child{color:#2563eb}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:7px}.calendar-day{min-width:0;min-height:74px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:6px 3px;text-align:left;color:var(--text)}.calendar-day.outside{background:#f8fafc;color:#aab2bf}.calendar-day.today .day-number{background:var(--primary);color:#fff}.calendar-day.selected{background:#eaf1ff;box-shadow:inset 0 0 0 2px var(--primary)}.day-number{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-size:12px;margin-bottom:4px}.day-total{font-size:10px;color:var(--primary);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-nav button{border:0;background:#eaf1ff;color:var(--primary);border-radius:10px;padding:9px 13px}.calendar-month{font-weight:800}.calendar-summary{display:flex;justify-content:space-between;margin-top:12px}.selected-date-title{margin:0 0 8px;font-size:16px}
    @media(max-width:380px){.amount{font-size:29px}.grid2{grid-template-columns:1fr}.pie{width:205px;height:205px}.pie:after{inset:46px}}
  </style>
</head>
<body>
<div class="app">
  <header><h1 id="pageTitle">ホーム</h1><p id="todayLabel"></p></header>
  <main>
    <section id="home" class="page active">
      <div class="card hero"><div class="muted">今月の支出</div><div class="amount" id="monthSpent">¥0</div><div id="monthName"></div></div>
      <div class="card"><div class="row"><span class="budget-title">月間予算</span><b id="monthBudgetText">¥0 / ¥0</b></div><div class="progress" id="monthProgress"><span></span></div><div class="row muted"><span id="monthPercent">0%</span><span id="monthRemaining">残り ¥0</span></div></div>
      <div class="card"><div class="row"><span class="budget-title">今週の予算</span><b id="weekBudgetText">¥0 / ¥0</b></div><div class="muted" id="currentWeekLabel"></div><div class="progress" id="weekProgress"><span></span></div><div class="row muted"><span id="weekPercent">0%</span><span id="weekRemaining">残り ¥0</span></div></div>
      <div class="card"><div class="row"><span class="budget-title">今日の予算</span><b id="dayBudgetText">¥0 / ¥0</b></div><div class="muted" id="todayBudgetLabel"></div><div class="progress" id="dayProgress"><span></span></div><div class="row muted"><span id="dayPercent">0%</span><span id="dayRemaining">残り ¥0</span></div></div>
      <div class="card"><h2 class="section-title">最近の支出</h2><div class="list" id="recentList"></div></div>
    </section>

    <section id="history" class="page">
      <div class="card"><div class="calendar-nav"><button id="prevHistoryMonth">‹</button><div class="calendar-month" id="historyMonthLabel"></div><button id="nextHistoryMonth">›</button></div><label>カテゴリ</label><select class="field" id="historyCategory"><option value="">すべて</option></select><div class="calendar-head"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar-grid" id="historyCalendar"></div><div class="calendar-summary"><span class="muted">月間合計</span><b id="historyTotal">¥0</b></div></div>
      <div class="card"><h2 class="selected-date-title" id="selectedDateTitle"></h2><div class="list" id="historyList"></div></div>
    </section>

    <section id="add" class="page">
      <div class="card"><h2 class="section-title" id="formTitle">支出を登録</h2><form id="expenseForm">
        <input type="hidden" id="expenseId"><label>金額</label><input class="field" id="amount" type="number" min="1" inputmode="numeric" placeholder="例：850" required>
        <label>日付</label><input class="field" id="date" type="date" required>
        <label>カテゴリ</label><select class="field" id="category" required></select>
        <label>内容・店名</label><input class="field" id="description" type="text" maxlength="50" placeholder="例：昼食、スーパー">
        <label>区分</label><select class="field" id="scope"><option value="個人">個人</option><option value="共通">共通</option></select>
        <label>メモ</label><textarea class="field" id="memo" maxlength="200" placeholder="任意"></textarea>
        <div class="actions"><button type="button" class="secondary" id="cancelEdit" hidden>キャンセル</button><button class="primary" type="submit">保存する</button></div>
      </form></div>
    </section>

    <section id="analysis" class="page">
      <div class="card"><div class="tabs"><button data-mode="week">週別</button><button class="active" data-mode="month">月別</button><button data-mode="year">年別</button></div><div class="period-controls"><button id="prevPeriod">‹</button><div class="period-label" id="analysisPeriod"></div><button id="nextPeriod">›</button></div></div>
      <div class="card"><div class="row"><h2 class="section-title">カテゴリ別支出</h2><b id="analysisTotal">¥0</b></div><div class="grid2" id="averageStats" style="margin:12px 0 4px"></div><div class="chart-wrap"><div class="pie" id="pieChart"><div class="pie-center"><span class="muted">合計</span><b id="pieTotal">¥0</b></div></div></div><div class="legend" id="legend"></div></div>
      <div class="card"><h2 class="section-title" id="breakdownTitle">内訳</h2><div id="breakdown" class="list"><div class="empty">円グラフのカテゴリをタップすると内訳を表示します</div></div></div>
    </section>

    <section id="settings" class="page">
      <div class="card"><h2 class="section-title">基本予算</h2><label>月間予算</label><input class="field" type="number" min="0" id="monthlyBudget"><label>基本週間予算</label><input class="field" type="number" min="0" id="weeklyBudget"><button class="primary wide" id="saveBudgets" style="margin-top:18px">予算を保存</button></div>
      <div class="card"><div class="row"><h2 class="section-title">週ごとの個別予算</h2><button class="secondary" id="addWeekBudget">追加</button></div><div class="muted" style="margin-bottom:12px">個別設定がない週には、基本週間予算が適用されます。</div><div class="week-list" id="weekBudgetList"></div></div>
      <div class="card"><h2 class="section-title">カテゴリ管理</h2><div class="muted" style="margin-bottom:12px">カテゴリの追加・削除・並び替えができます。並び順は支出登録と分析画面にも反映されます。</div><div class="filter-row"><div><label style="margin-top:0">アイコン</label><input class="field" id="newCategoryIcon" type="text" maxlength="4" value="💰"></div><div><label style="margin-top:0">色</label><select class="field" id="newCategoryColor"></select></div></div><label>カテゴリ名</label><input class="field" id="newCategoryName" type="text" maxlength="20" placeholder="例：医療費"><button class="primary wide" id="addCategory" style="margin-top:14px">カテゴリを追加</button><div class="week-list" id="categoryList" style="margin-top:14px"></div></div>
      <div class="card"><h2 class="section-title">データ管理</h2><div class="actions"><button class="secondary" id="exportData">バックアップ</button><button class="secondary" id="importData">復元</button></div><input type="file" id="importFile" accept="application/json" hidden><button class="danger wide" id="clearData" style="margin-top:12px">すべてのデータを削除</button></div>
    </section>
  </main>
  <button class="fab" id="fab">＋ 支出を追加</button>
  <nav>
    <button class="active" data-page="home"><span>⌂</span>ホーム</button><button data-page="history"><span>☷</span>履歴</button><button data-page="add"><span>＋</span>登録</button><button data-page="analysis"><span>◕</span>分析</button><button data-page="settings"><span>⚙</span>設定</button>
  </nav>
</div>
<dialog id="weekDialog"><div class="modal-body"><div class="modal-head"><h2 class="section-title">週の予算を設定</h2><button class="close" id="closeWeekDialog">×</button></div><label>週に含まれる日</label><input class="field" type="date" id="weekDate"><div class="muted" id="weekRangePreview" style="margin-top:7px"></div><label>この週の予算</label><input class="field" type="number" min="0" id="customWeekBudget"><div class="actions"><button class="secondary" id="deleteWeekBudget">個別設定を削除</button><button class="primary" id="saveWeekBudget">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
(() => {
  const KEY='expenseManagerData_v1';
  const DEFAULT_CATEGORIES=[
    {name:'食費',icon:'🍚',color:'#3b82f6'},{name:'日用品',icon:'🧴',color:'#14b8a6'},{name:'交際費',icon:'🍻',color:'#f59e0b'},
    {name:'交通費',icon:'🚃',color:'#8b5cf6'},{name:'趣味・娯楽',icon:'🎮',color:'#ec4899'},{name:'美容・衣服',icon:'👕',color:'#f97316'},
    {name:'住居・固定費',icon:'🏠',color:'#64748b'},{name:'その他',icon:'📦',color:'#94a3b8'}
  ];
  const COLOR_PALETTE=[
    {name:'ブルー',value:'#3b82f6'},{name:'スカイ',value:'#0ea5e9'},{name:'シアン',value:'#06b6d4'},{name:'ティール',value:'#14b8a6'},{name:'グリーン',value:'#22c55e'},
    {name:'ライム',value:'#84cc16'},{name:'イエロー',value:'#eab308'},{name:'アンバー',value:'#f59e0b'},{name:'オレンジ',value:'#f97316'},{name:'レッド',value:'#ef4444'},
    {name:'ローズ',value:'#f43f5e'},{name:'ピンク',value:'#ec4899'},{name:'パープル',value:'#a855f7'},{name:'バイオレット',value:'#8b5cf6'},{name:'スレート',value:'#64748b'}
  ];
  const defaultData={expenses:[],settings:{monthlyBudget:120000,weeklyBudget:20000,customWeeks:{},customCategories:[],hiddenCategories:[],categoryOrder:[]}};
  let data=load(); let analysisMode='month'; let analysisDate=startOfMonth(new Date()); let selectedCategory=''; let historyDate=startOfMonth(new Date()); let selectedHistoryDate='';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  function categories(){const hidden=new Set(data.settings.hiddenCategories||[]);let base=[...DEFAULT_CATEGORIES,...(data.settings.customCategories||[])].filter(c=>!hidden.has(c.name));const known=new Set(base.map(c=>c.name));data.expenses.forEach(e=>{if(!known.has(e.category)&&!hidden.has(e.category)){base.push({name:e.category,icon:'📦',color:'#94a3b8'});known.add(e.category)}});const order=data.settings.categoryOrder||[];base.sort((a,b)=>{const ai=order.indexOf(a.name),bi=order.indexOf(b.name);return (ai<0?9999:ai)-(bi<0?9999:bi)});return base}
  function load(){try{return {...defaultData,...JSON.parse(localStorage.getItem(KEY)||'{}'),settings:{...defaultData.settings,...(JSON.parse(localStorage.getItem(KEY)||'{}').settings||{})}}}catch{return structuredClone(defaultData)}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  const money=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
  const iso=d=>{const x=new Date(d); return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};
  const localDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
  function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
  function endOfWeek(d){const x=startOfWeek(d);x.setDate(x.getDate()+6);return x}
  function formatDate(d,full=false){return new Intl.DateTimeFormat('ja-JP',full?{year:'numeric',month:'long',day:'numeric',weekday:'short'}:{month:'numeric',day:'numeric',weekday:'short'}).format(d)}
  function weekKey(d){return iso(startOfWeek(d))}
  function betweenExpense(e,start,end){const d=localDate(e.date);return d>=start&&d<=end}
  function page(name){$$('.page').forEach(x=>x.classList.toggle('active',x.id===name));$$('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));$('#pageTitle').textContent={home:'ホーム',history:'履歴',add:'支出登録',analysis:'分析',settings:'設定'}[name];$('#fab').style.display=name==='add'?'none':'block';if(name==='home')renderHome();if(name==='history')renderHistory();if(name==='analysis')renderAnalysis();if(name==='settings')renderSettings();scrollTo(0,0)}
  function getCat(name){return categories().find(c=>c.name===name)||categories().at(-1)}
  function expenseItem(e,clickable=true){const c=getCat(e.category);const div=document.createElement('div');div.className='item';div.innerHTML=`<div class="icon">${c.icon}</div><div><div class="item-title">${escapeHtml(e.description||e.category)}</div><div class="muted">${formatDate(localDate(e.date))} ・ ${escapeHtml(e.category)}</div><span class="tag">${escapeHtml(e.scope||'個人')}</span></div><div class="item-amount">${money(e.amount)}</div>`;if(clickable){div.style.cursor='pointer';div.onclick=()=>editExpense(e.id)}return div}
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function renderHome(){const now=new Date(),ms=startOfMonth(now),me=new Date(now.getFullYear(),now.getMonth()+1,0),ws=startOfWeek(now),we=endOfWeek(now);const month=sum(data.expenses.filter(e=>betweenExpense(e,ms,me))),week=sum(data.expenses.filter(e=>betweenExpense(e,ws,we))),today=sum(data.expenses.filter(e=>e.date===iso(now)));$('#monthSpent').textContent=money(month);$('#monthName').textContent=`${now.getFullYear()}年${now.getMonth()+1}月`;setProgress('month',month,Number(data.settings.monthlyBudget));const wb=Number(data.settings.customWeeks[weekKey(now)]??data.settings.weeklyBudget);setProgress('week',week,wb);$('#currentWeekLabel').textContent=`${formatDate(ws)} ～ ${formatDate(we)}`;setProgress('day',today,wb/7);$('#todayBudgetLabel').textContent=formatDate(now,true);const recent=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).slice(0,5);const box=$('#recentList');box.innerHTML='';if(!recent.length)box.innerHTML='<div class="empty">まだ支出がありません</div>';recent.forEach(e=>box.append(expenseItem(e)))}
  function setProgress(prefix,spent,budget){const pct=budget?Math.round(spent/budget*100):0,remain=budget-spent;$('#'+prefix+'BudgetText').textContent=`${money(spent)} / ${money(budget)}`;$('#'+prefix+'Percent').textContent=pct+'%';$('#'+prefix+'Remaining').textContent=remain>=0?`残り ${money(remain)}`:`超過 ${money(-remain)}`;const p=$('#'+prefix+'Progress');p.classList.toggle('over',spent>budget&&budget>0);p.querySelector('span').style.width=Math.min(pct,100)+'%'}
  function sum(arr){return arr.reduce((a,e)=>a+Number(e.amount),0)}
  function renderHistory(){if(!selectedHistoryDate)selectedHistoryDate=iso(new Date());const y=historyDate.getFullYear(),m=historyDate.getMonth(),filter=$('#historyCategory').value;$('#historyMonthLabel').textContent=`${y}年${m+1}月`;const monthItems=data.expenses.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)&&(!filter||e.category===filter));$('#historyTotal').textContent=money(sum(monthItems));const cal=$('#historyCalendar');cal.innerHTML='';const first=new Date(y,m,1);first.setDate(1-first.getDay());for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const key=iso(d),items=data.expenses.filter(e=>e.date===key&&(!filter||e.category===filter)),btn=document.createElement('button');btn.className='calendar-day';if(d.getMonth()!==m)btn.classList.add('outside');if(key===iso(new Date()))btn.classList.add('today');if(key===selectedHistoryDate)btn.classList.add('selected');btn.innerHTML=`<span class="day-number">${d.getDate()}</span>${items.length?`<div class="day-total">${money(sum(items))}</div>`:''}`;btn.onclick=()=>{selectedHistoryDate=key;if(d.getMonth()!==m)historyDate=startOfMonth(d);renderHistory()};cal.append(btn)}renderHistoryDetails()}
  function renderHistoryDetails(){const filter=$('#historyCategory').value,d=localDate(selectedHistoryDate),list=data.expenses.filter(e=>e.date===selectedHistoryDate&&(!filter||e.category===filter)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('#selectedDateTitle').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${money(sum(list))}`;const box=$('#historyList');box.innerHTML='';if(!list.length)box.innerHTML='<div class="empty">この日の支出はありません</div>';list.forEach(e=>box.append(expenseItem(e)))}
  function editExpense(id){const e=data.expenses.find(x=>x.id===id);if(!e)return;$('#expenseId').value=e.id;$('#amount').value=e.amount;$('#date').value=e.date;$('#category').value=e.category;$('#description').value=e.description||'';$('#scope').value=e.scope||'個人';$('#memo').value=e.memo||'';$('#formTitle').textContent='支出を編集';$('#cancelEdit').hidden=false;page('add')}
  function resetForm(){ $('#expenseForm').reset();$('#expenseId').value='';$('#date').value=iso(new Date());$('#formTitle').textContent='支出を登録';$('#cancelEdit').hidden=true }
  function periodRange(){if(analysisMode==='year'){const y=analysisDate.getFullYear();return [y===2026?new Date(2026,9,1):new Date(y,0,1),new Date(y,11,31)]};if(analysisMode==='month')return [startOfMonth(analysisDate),new Date(analysisDate.getFullYear(),analysisDate.getMonth()+1,0)];return [startOfWeek(analysisDate),endOfWeek(analysisDate)]}
  function renderAverageStats(total,start,end){const days=Math.max(1,Math.round((end-start)/86400000)+1),stats=[['1日平均',total/days]];if(analysisMode==='month'||analysisMode==='year')stats.push(['1週平均',total/(days/7)]);if(analysisMode==='year'){const months=(end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth())+1;stats.push(['1月平均',total/Math.max(1,months)])};$('#averageStats').innerHTML=stats.map(([label,value])=>`<div class="stat"><span class="muted">${label}</span><b>${money(value)}</b></div>`).join('')}
  function renderAnalysis(){const [start,end]=periodRange();$('#analysisPeriod').textContent=analysisMode==='year'?`${start.getFullYear()}年`:analysisMode==='month'?`${start.getFullYear()}年${start.getMonth()+1}月`:`${formatDate(start)} ～ ${formatDate(end)}`;const list=data.expenses.filter(e=>betweenExpense(e,start,end));const totals=categories().map(c=>({...c,value:sum(list.filter(e=>e.category===c.name))})).filter(x=>x.value>0);const total=sum(list);$('#analysisTotal').textContent=$('#pieTotal').textContent=money(total);renderAverageStats(total,start,end);let acc=0;const parts=totals.map(x=>{const a=acc/total*360;acc+=x.value;return `${x.color} ${a}deg ${acc/total*360}deg`});$('#pieChart').style.background=total?`conic-gradient(${parts.join(',')})`:'#e5e7eb';const legend=$('#legend');legend.innerHTML='';if(!totals.length)legend.innerHTML='<div class="empty">この期間の支出はありません</div>';totals.forEach(x=>{const row=document.createElement('button');row.className='legend-row';row.style='border:0;background:transparent;width:100%;padding:5px;text-align:left;color:inherit';row.innerHTML=`<span class="dot" style="background:${x.color}"></span><span>${escapeHtml(x.name)} <span class="muted">${(x.value/total*100).toFixed(1)}%</span></span><b>${money(x.value)}</b>`;row.onclick=()=>renderBreakdown(x.name,list);legend.append(row)});if(selectedCategory&&totals.some(x=>x.name===selectedCategory))renderBreakdown(selectedCategory,list);else{$('#breakdownTitle').textContent='内訳';$('#breakdown').innerHTML='<div class="empty">カテゴリをタップすると内訳を表示します</div>'}}
  function renderBreakdown(cat,list){selectedCategory=cat;$('#breakdownTitle').textContent=cat+'の内訳';const box=$('#breakdown');box.innerHTML='';list.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>box.append(expenseItem(e)))}
  function renderSettings(){$('#monthlyBudget').value=data.settings.monthlyBudget;$('#weeklyBudget').value=data.settings.weeklyBudget;const box=$('#weekBudgetList');box.innerHTML='';const entries=Object.entries(data.settings.customWeeks).sort();if(!entries.length)box.innerHTML='<div class="empty">個別設定はありません</div>';entries.forEach(([key,value])=>{const s=localDate(key),e=endOfWeek(s),row=document.createElement('button');row.className='week-row';row.style='border:0;background:#f7f9fc;border-radius:12px;padding:12px;text-align:left;color:inherit';row.innerHTML=`<span>${formatDate(s)} ～ ${formatDate(e)}</span><b style="text-align:right">${money(value)}</b>`;row.onclick=()=>openWeekDialog(s);box.append(row)});renderCategoryList()}
  function refreshCategorySelects(){const selected=$('#category').value,filter=$('#historyCategory').value;$('#category').innerHTML='';$('#historyCategory').innerHTML='<option value="">すべて</option>';categories().forEach(c=>{$('#category').add(new Option(`${c.icon} ${c.name}`,c.name));$('#historyCategory').add(new Option(c.name,c.name))});if(categories().some(c=>c.name===selected))$('#category').value=selected;if(categories().some(c=>c.name===filter))$('#historyCategory').value=filter}
  function syncCategoryOrder(){const names=categories().map(c=>c.name);const old=data.settings.categoryOrder||[];data.settings.categoryOrder=[...old.filter(n=>names.includes(n)),...names.filter(n=>!old.includes(n))]}
  function moveCategory(name,direction){syncCategoryOrder();const order=data.settings.categoryOrder,i=order.indexOf(name),j=i+direction;if(i<0||j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];save();refreshCategorySelects();renderCategoryList();toast('並び順を変更しました')}
  function deleteCategory(name){if(name==='その他'){alert('「その他」は支出の移行先として使用するため削除できません。');return}const used=data.expenses.filter(e=>e.category===name).length;const message=used?`「${name}」を削除しますか？\n登録済みの支出 ${used}件は「その他」に変更されます。`:`「${name}」を削除しますか？`;if(!confirm(message))return;data.expenses.forEach(e=>{if(e.category===name)e.category='その他'});data.settings.customCategories=(data.settings.customCategories||[]).filter(x=>x.name!==name);if(DEFAULT_CATEGORIES.some(x=>x.name===name)){data.settings.hiddenCategories=data.settings.hiddenCategories||[];if(!data.settings.hiddenCategories.includes(name))data.settings.hiddenCategories.push(name)}data.settings.categoryOrder=(data.settings.categoryOrder||[]).filter(n=>n!==name);save();refreshCategorySelects();renderCategoryList();toast('カテゴリを削除しました')}
  function renderCategoryList(){syncCategoryOrder();const box=$('#categoryList');box.innerHTML='';const cats=categories();cats.forEach((c,i)=>{const row=document.createElement('div');row.style='display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#f7f9fc;border-radius:12px;padding:10px 12px';row.innerHTML=`<span><span class="swatch" style="background:${c.color}"></span>${c.icon} ${escapeHtml(c.name)}</span><span style="display:flex;gap:5px"><button class="secondary cat-up" style="padding:7px 10px" ${i===0?'disabled':''} aria-label="上へ">↑</button><button class="secondary cat-down" style="padding:7px 10px" ${i===cats.length-1?'disabled':''} aria-label="下へ">↓</button><button class="danger cat-delete" style="padding:7px 10px" ${c.name==='その他'?'disabled title="「その他」は削除できません"':''}>削除</button></span>`;row.querySelector('.cat-up').onclick=()=>moveCategory(c.name,-1);row.querySelector('.cat-down').onclick=()=>moveCategory(c.name,1);if(c.name!=='その他')row.querySelector('.cat-delete').onclick=()=>deleteCategory(c.name);box.append(row)})}
  function openWeekDialog(d=new Date()){const s=startOfWeek(d);$('#weekDate').value=iso(d);$('#customWeekBudget').value=data.settings.customWeeks[weekKey(d)]??data.settings.weeklyBudget;$('#deleteWeekBudget').disabled=!(weekKey(d) in data.settings.customWeeks);updateWeekPreview();$('#weekDialog').showModal()}
  function updateWeekPreview(){const d=localDate($('#weekDate').value||iso(new Date())),s=startOfWeek(d),e=endOfWeek(d);$('#weekRangePreview').textContent=`対象：${formatDate(s,true)} ～ ${formatDate(e,true)}`}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  function init(){const now=new Date();$('#todayLabel').textContent=formatDate(now,true);$('#date').value=iso(now);selectedHistoryDate=iso(now);COLOR_PALETTE.forEach(c=>{$('#newCategoryColor').add(new Option('● '+c.name,c.value))});$('#newCategoryColor').value='#22c55e';refreshCategorySelects();document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;e.preventDefault();page(b.dataset.page)});$('#fab').onclick=()=>{resetForm();page('add')};$('#expenseForm').onsubmit=e=>{e.preventDefault();const id=$('#expenseId').value;const item={id:id||((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():('exp-'+Date.now()+'-'+Math.random().toString(16).slice(2))),amount:Number($('#amount').value),date:$('#date').value,category:$('#category').value,description:$('#description').value.trim(),scope:$('#scope').value,memo:$('#memo').value.trim(),createdAt:id?(data.expenses.find(x=>x.id===id)?.createdAt||Date.now()):Date.now()};if(id)data.expenses=data.expenses.map(x=>x.id===id?item:x);else data.expenses.push(item);save();resetForm();toast(id?'更新しました':'登録しました');page('home')};$('#cancelEdit').onclick=()=>{resetForm();page('home')};$('#prevHistoryMonth').onclick=()=>{historyDate=new Date(historyDate.getFullYear(),historyDate.getMonth()-1,1);selectedHistoryDate=iso(historyDate);renderHistory()};$('#nextHistoryMonth').onclick=()=>{historyDate=new Date(historyDate.getFullYear(),historyDate.getMonth()+1,1);selectedHistoryDate=iso(historyDate);renderHistory()};$('#historyCategory').onchange=renderHistory;
    $$('.tabs button').forEach(b=>b.onclick=()=>{analysisMode=b.dataset.mode;selectedCategory='';$$('.tabs button').forEach(x=>x.classList.toggle('active',x===b));analysisDate=analysisMode==='year'?new Date(new Date().getFullYear(),0,1):analysisMode==='month'?startOfMonth(new Date()):startOfWeek(new Date());renderAnalysis()});$('#prevPeriod').onclick=()=>{analysisDate=new Date(analysisDate);analysisMode==='year'?analysisDate.setFullYear(analysisDate.getFullYear()-1):analysisMode==='month'?analysisDate.setMonth(analysisDate.getMonth()-1):analysisDate.setDate(analysisDate.getDate()-7);selectedCategory='';renderAnalysis()};$('#nextPeriod').onclick=()=>{analysisDate=new Date(analysisDate);analysisMode==='year'?analysisDate.setFullYear(analysisDate.getFullYear()+1):analysisMode==='month'?analysisDate.setMonth(analysisDate.getMonth()+1):analysisDate.setDate(analysisDate.getDate()+7);selectedCategory='';renderAnalysis()};
    $('#saveBudgets').onclick=()=>{data.settings.monthlyBudget=Number($('#monthlyBudget').value)||0;data.settings.weeklyBudget=Number($('#weeklyBudget').value)||0;save();toast('予算を保存しました');renderSettings()};$('#addWeekBudget').onclick=()=>openWeekDialog();$('#closeWeekDialog').onclick=()=>$('#weekDialog').close();$('#weekDate').onchange=()=>{const d=localDate($('#weekDate').value);$('#customWeekBudget').value=data.settings.customWeeks[weekKey(d)]??data.settings.weeklyBudget;$('#deleteWeekBudget').disabled=!(weekKey(d) in data.settings.customWeeks);updateWeekPreview()};$('#saveWeekBudget').onclick=()=>{const d=localDate($('#weekDate').value),v=Number($('#customWeekBudget').value)||0;data.settings.customWeeks[weekKey(d)]=v;save();$('#weekDialog').close();renderSettings();toast('週予算を保存しました')};$('#deleteWeekBudget').onclick=()=>{delete data.settings.customWeeks[weekKey(localDate($('#weekDate').value))];save();$('#weekDialog').close();renderSettings();toast('個別設定を削除しました')};
    $('#addCategory').onclick=()=>{const name=$('#newCategoryName').value.trim(),icon=$('#newCategoryIcon').value.trim()||'💰',color=$('#newCategoryColor').value;if(!name){alert('カテゴリ名を入力してください。');return}if(categories().some(c=>c.name===name)){alert('同じ名前のカテゴリが既にあります。');return}data.settings.customCategories=data.settings.customCategories||[];data.settings.customCategories.push({name,icon,color});data.settings.categoryOrder=data.settings.categoryOrder||[];data.settings.categoryOrder.push(name);save();$('#newCategoryName').value='';refreshCategorySelects();renderCategoryList();toast('カテゴリを追加しました')};
    $('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`支出管理バックアップ_${iso(new Date())}.json`;a.click();URL.revokeObjectURL(a.href)};$('#importData').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.expenses)||!obj.settings)throw 0;data=obj;save();renderSettings();toast('データを復元しました')}catch{alert('正しいバックアップファイルではありません。')}e.target.value=''};$('#clearData').onclick=()=>{if(confirm('すべての支出・予算データを削除しますか？')){data=JSON.parse(JSON.stringify(defaultData));save();renderSettings();toast('削除しました')}};renderHome()}
  init();
})();
